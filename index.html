<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>犬山ユースプラットフォーム</title>
<style>
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">

<style>
/* ============ tokens ============ */
:root{
  --ink:#0E1A24; --ink2:#41535F; --ink3:#71838E;
  --paper:#E9EDEC; --surface:#FFFFFF; --surface2:#F3F6F4; --surface3:#E4E9E7;
  --line:#D2D9D6; --line2:#BCC6C2;
  --ai:#1F4B73; --ai-ink:#1F4B73; --ai-soft:#E1E9F1; --ai-line:#B9CBDD;
  --shu:#C8412F; --shu-soft:#F7E5E1;
  --kin:#9A6F27; --kin-soft:#F2E9D6;
  --midori:#2F6B47; --midori-soft:#DDEBE1;
  --lv1:#5E9AA2; --lv2:#3B7FA0; --lv3:#2A5A85; --lv4:#1E3A5F;
  --shadow:0 1px 2px rgba(14,26,36,.06), 0 8px 24px -12px rgba(14,26,36,.22);
  --shadow-lg:0 24px 60px -20px rgba(14,26,36,.35);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7EDF0; --ink2:#A6B6C0; --ink3:#74868F;
    --paper:#0C151D; --surface:#14212C; --surface2:#1A2935; --surface3:#223341;
    --line:#283947; --line2:#364A5A;
    --ai:#82B2DA; --ai-ink:#9DC5E6; --ai-soft:#1A3044; --ai-line:#2E4B65;
    --shu:#E67A63; --shu-soft:#3A2019;
    --kin:#D3A458; --kin-soft:#332913;
    --midori:#68AD82; --midori-soft:#16301F;
    --lv1:#7FBAC1; --lv2:#5A9FBF; --lv3:#4A85B4; --lv4:#5C7FA8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
    --shadow-lg:0 30px 70px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ink:#E7EDF0; --ink2:#A6B6C0; --ink3:#74868F;
  --paper:#0C151D; --surface:#14212C; --surface2:#1A2935; --surface3:#223341;
  --line:#283947; --line2:#364A5A;
  --ai:#82B2DA; --ai-ink:#9DC5E6; --ai-soft:#1A3044; --ai-line:#2E4B65;
  --shu:#E67A63; --shu-soft:#3A2019;
  --kin:#D3A458; --kin-soft:#332913;
  --midori:#68AD82; --midori-soft:#16301F;
  --lv1:#7FBAC1; --lv2:#5A9FBF; --lv3:#4A85B4; --lv4:#5C7FA8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -24px rgba(0,0,0,.8);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;margin:0;text-wrap:balance;line-height:1.4}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--ai-ink)}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px;border-radius:4px}
.num{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ============ shell ============ */
.app{max-width:1240px;margin:0 auto;padding:0 20px 96px}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.brand svg{flex:none;display:block}
.brand-txt{min-width:0}
.brand-ja{font-family:"Shippori Mincho",serif;font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.2;white-space:nowrap}
.brand-en{font-size:9.5px;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;line-height:1.6;white-space:nowrap}

.role{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.role button{
  padding:5px 15px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--ink2);
  transition:background .15s,color .15s;white-space:nowrap;
}
.role button[aria-pressed="true"]{background:var(--ai);color:#fff}
:root[data-theme="dark"] .role button[aria-pressed="true"],
:root:not([data-theme="light"]) .role button[aria-pressed="true"]{color:#0C151D}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .role button[aria-pressed="true"]{color:#fff}}

.wallet{display:flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--kin);border-radius:999px;background:var(--kin-soft);white-space:nowrap}
.wallet .lab{font-size:10.5px;letter-spacing:.1em;color:var(--kin)}
.wallet .val{font-size:14px;font-weight:500;color:var(--kin)}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);background:var(--surface)}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px}
.tab{
  padding:12px 14px 11px;font-size:13.5px;font-weight:500;color:var(--ink2);
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ai-ink);border-bottom-color:var(--shu)}
.tab .cnt{font-size:11px;color:var(--ink3);margin-left:5px;font-family:"Roboto Mono",monospace}

/* ============ page head ============ */
.phead{padding:34px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.phead h1{font-size:clamp(22px,3.4vw,29px);letter-spacing:.01em}
.phead .sub{font-size:13.5px;color:var(--ink2);margin-top:7px;max-width:62ch}
.eyebrow{font-size:10.5px;letter-spacing:.2em;color:var(--shu);font-weight:700;margin-bottom:9px}

/* ============ filters ============ */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flab{font-size:11px;letter-spacing:.12em;color:var(--ink3);width:74px;flex:none}
.chip{
  padding:5px 13px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px;color:var(--ink2);
  background:var(--surface);transition:all .15s;display:inline-flex;align-items:center;gap:6px;
}
.chip:hover{border-color:var(--ai);color:var(--ai-ink)}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--surface)}
:root[data-theme="dark"] .chip[aria-pressed="true"],
:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C151D}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .chip[aria-pressed="true"]{color:#fff}}
.chip .dot{width:7px;height:7px;border-radius:2px;flex:none}
.search{flex:1;min-width:190px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:var(--r);padding:7px 12px;background:var(--surface)}
.search:focus-within{border-color:var(--ai)}
.search input{border:none;background:none;outline:none;width:100%;font-size:13.5px}
.search svg{flex:none;color:var(--ink3)}

.resbar{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:20px 2px 12px;flex-wrap:wrap}
.rescount{font-size:13px;color:var(--ink2)}
.rescount b{font-family:"Roboto Mono",monospace;font-size:18px;font-weight:500;color:var(--ink)}
.sortsel{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12.5px;color:var(--ink2)}

/* ============ cards ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 18px 15px 21px;text-align:left;display:flex;flex-direction:column;gap:11px;
  transition:border-color .18s,transform .18s,box-shadow .18s;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lvc)}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow)}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lv{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--lvc)}
.lv .bars{display:flex;gap:2px}
.lv .bars i{width:4px;height:10px;border-radius:1px;background:var(--lvc);opacity:.22}
.lv .bars i.on{opacity:1}
.org-type{font-size:10.5px;padding:2px 7px;border-radius:4px;background:var(--surface3);color:var(--ink2);letter-spacing:.06em}
.badge-new{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--shu);border:1px solid var(--shu);border-radius:4px;padding:1px 6px}
.card h3{font-size:16.5px;line-height:1.5;letter-spacing:.01em}
.card .org{font-size:12.5px;color:var(--ink2)}
.card-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:auto;padding-top:4px}
.card-meta span{display:inline-flex;align-items:center;gap:5px}
.card-meta svg{color:var(--ink3);flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.slots{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);padding-top:11px}
.bar{flex:1;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lvc);border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.slots .n{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.slots .n b{font-family:"Roboto Mono",monospace;font-weight:500;color:var(--ink);font-size:13px}
.card.full{opacity:.62}
.reward{font-size:12px;color:var(--kin);font-weight:500;white-space:nowrap}

.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:52px 20px;text-align:center;color:var(--ink3);font-size:13.5px}

/* ============ drawer ============ */
.scrim{position:fixed;inset:0;background:rgba(10,20,28,.5);backdrop-filter:blur(2px);z-index:60;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);z-index:61;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.drawer.on{transform:none}
.dw-head{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dw-head h2{font-size:20px;line-height:1.5;flex:1}
.xbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none;transition:background .15s}
.xbtn:hover{background:var(--surface2)}
.dw-body{flex:1;overflow-y:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:20px}
.dw-foot{border-top:1px solid var(--line);padding:14px 24px;display:flex;gap:12px;align-items:center;background:var(--surface)}
.spec{display:grid;grid-template-columns:88px 1fr;gap:10px 14px;font-size:13.5px}
.spec dt{font-size:11.5px;letter-spacing:.08em;color:var(--ink3);padding-top:3px}
.spec dd{margin:0;color:var(--ink)}
.sec h4{font-size:12px;letter-spacing:.14em;color:var(--shu);margin-bottom:8px;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700}
.sec p{font-size:13.5px;color:var(--ink2);line-height:1.85}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0}
.steps li{display:flex;gap:12px;font-size:13px;color:var(--ink2);padding-bottom:14px;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:1px;background:var(--line2)}
.steps .k{flex:none;width:19px;height:19px;border-radius:50%;border:1px solid var(--ai-line);background:var(--ai-soft);color:var(--ai-ink);display:grid;place-items:center;font-size:10.5px;font-family:"Roboto Mono",monospace;margin-top:2px;z-index:1}
.people{display:flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--surface);margin-right:-7px;font-family:"Roboto Mono",monospace}
:root[data-theme="dark"] .av,:root:not([data-theme="light"]) .av{color:#0C151D}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .av{color:#fff}}

.btn{
  padding:11px 20px;border-radius:8px;font-size:14px;font-weight:700;background:var(--ai);color:var(--surface);
  transition:filter .15s,transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#0C151D}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.flex{flex:1}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--ink2);font-weight:500}
.btn.ghost:hover{border-color:var(--ai);color:var(--ai-ink);filter:none}
.btn.shu{background:var(--shu)}
.btn:disabled{background:var(--surface3);color:var(--ink3);cursor:default;filter:none}
:root[data-theme="dark"] .btn:disabled,:root:not([data-theme="light"]) .btn:disabled{color:var(--ink3)}
.btn.sm{padding:7px 14px;font-size:12.5px;border-radius:7px}

/* ============ my page ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat .lab{font-size:11px;letter-spacing:.12em;color:var(--ink3)}
.stat .v{font-family:"Roboto Mono",monospace;font-size:30px;font-weight:500;line-height:1.25;margin-top:4px;letter-spacing:-.02em}
.stat .u{font-size:12px;color:var(--ink2);margin-left:3px;font-family:"Zen Kaku Gothic New",sans-serif}
.stat .foot{font-size:11.5px;color:var(--ink3);margin-top:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.panel > h3{font-size:16px;margin-bottom:4px}
.panel .note{font-size:12.5px;color:var(--ink2);margin-bottom:16px}
.ladder{display:flex;flex-direction:column;gap:2px}
.rung{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:8px;background:var(--surface2);border:1px solid transparent}
.rung.done{background:var(--ai-soft);border-color:var(--ai-line)}
.rung .mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;color:var(--surface)}
.rung.done .mark{background:var(--lvc);border-color:var(--lvc)}
.rung .t{font-size:13.5px;font-weight:500}
.rung .d{font-size:11.5px;color:var(--ink3)}
.rung .c{margin-left:auto;font-size:11.5px;color:var(--ink2);font-family:"Roboto Mono",monospace}

.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.hist li{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start}
.hist li:first-child{border-top:none;padding-top:0}
.hist .when{font-size:11.5px;color:var(--ink3);font-family:"Roboto Mono",monospace;width:64px;flex:none;padding-top:2px}
.hist .t{font-size:13.5px;font-weight:500}
.hist .m{font-size:12px;color:var(--ink2)}
.status{font-size:10.5px;padding:2px 8px;border-radius:999px;margin-left:auto;flex:none;white-space:nowrap;letter-spacing:.05em}
.status.on{background:var(--midori-soft);color:var(--midori)}
.status.wait{background:var(--kin-soft);color:var(--kin)}
.status.done{background:var(--surface3);color:var(--ink2)}

.cert{
  border:1px solid var(--kin);border-radius:var(--r);padding:20px 22px;background:
  linear-gradient(135deg,var(--kin-soft),var(--surface) 70%);position:relative;overflow:hidden;
}
.cert .ttl{font-family:"Shippori Mincho",serif;font-size:17px;font-weight:700}
.cert .who{font-size:12.5px;color:var(--ink2);margin-top:2px}
.cert .list{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.cert .row{display:flex;gap:10px;font-size:12.5px;align-items:baseline}
.cert .row .dt{font-family:"Roboto Mono",monospace;color:var(--ink3);font-size:11px;flex:none}
.cert .seal{position:absolute;right:18px;top:16px;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--kin);color:var(--kin);display:grid;place-items:center;font-family:"Shippori Mincho",serif;font-size:10px;line-height:1.25;text-align:center;letter-spacing:.05em;opacity:.85}
.shops{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.shop{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--ink2);background:var(--surface2)}

/* ============ forms ============ */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.5px;letter-spacing:.1em;color:var(--ink3)}
.field input[type=text],.field textarea,.field select,.field input[type=number]{
  border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;width:100%;
}
.field textarea{resize:vertical;min-height:86px;line-height:1.8}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ai)}
.field .hint{font-size:11.5px;color:var(--ink3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lvpick{display:flex;gap:8px;flex-wrap:wrap}
.lvpick button{border:1px solid var(--line2);border-radius:8px;padding:9px 13px;text-align:left;flex:1;min-width:132px;transition:all .15s;background:var(--surface)}
.lvpick button:hover{border-color:var(--lvc)}
.lvpick button[aria-pressed="true"]{border-color:var(--lvc);background:var(--ai-soft);box-shadow:inset 0 0 0 1px var(--lvc)}
.lvpick .n{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--lvc)}
.lvpick .t{font-size:13px;font-weight:500}
.lvpick .d{font-size:11px;color:var(--ink3)}

/* ============ proposals / stories ============ */
.prop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:11px}
.prop .q{font-family:"Shippori Mincho",serif;font-size:18px;font-weight:700;line-height:1.55}
.prop .q .fill{border-bottom:2px solid var(--shu);padding-bottom:1px}
.prop .by{font-size:12px;color:var(--ink2)}
.prop .body{font-size:13.5px;color:var(--ink2);line-height:1.85}
.prop-foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.react{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--ink2);transition:all .15s}
.react:hover{border-color:var(--shu);color:var(--shu)}
.react[aria-pressed="true"]{background:var(--shu-soft);border-color:var(--shu);color:var(--shu)}
.react .n{font-family:"Roboto Mono",monospace}
.pill-status{font-size:11px;color:var(--ink3);margin-left:auto}

.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.story .strip{height:5px;background:linear-gradient(90deg,var(--lvc),color-mix(in srgb,var(--lvc) 30%,var(--surface)))}
.story .in{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.story h3{font-size:17px;line-height:1.5}
.story .meta{font-size:12px;color:var(--ink3)}
.outcomes{display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0}
.outcome .v{font-family:"Roboto Mono",monospace;font-size:22px;font-weight:500;color:var(--ai-ink);line-height:1.2}
.outcome .l{font-size:11px;color:var(--ink3);letter-spacing:.06em}

/* ============ region view ============ */
.appl{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}

.appl .who{font-size:13.5px;font-weight:500}
.appl .uni{font-size:11.5px;color:var(--ink3)}
.appl .msg{font-size:12.5px;color:var(--ink2);flex:1;min-width:0}

/* ============ toast ============ */
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:pop .3s cubic-bezier(.2,.9,.3,1.3);
  max-width:min(92vw,460px);
}
.toast .ic{color:var(--midori)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

.footnote{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.9}

.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:24px}
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:start}
@media (max-width:860px){
  .cols{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .flab{width:100%}

function toast(msg){

  el.className="toast";
  el.innerHTML='<span class="ic"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>'+esc(msg)+"</span>";

/* ---------- ナビ ---------- */
function renderTabs(){
  const list = TABS[state.role];
  if(!list.some(t=>t[0]===state.tab)) state.tab = list[0][0];
  $("#tabs").innerHTML = list.map(([k,label])=>{
    let cnt="";
    if(k==="find") cnt='<span class="cnt">'+cases.filter(c=>c.joined<c.need).length+"</span>";
    if(k==="me")   cnt='<span class="cnt">'+state.my.length+"</span>";
    if(k==="manage") cnt='<span class="cnt">'+Object.values(applicants).reduce((a,b)=>a+b.length,0)+"</span>";
    if(k==="voices"||k==="want") cnt='<span class="cnt">'+proposals.length+"</span>";
    return '<button class="tab" role="tab" data-tab="'+k+'" aria-selected="'+(state.tab===k)+'">'+label+cnt+"</button>";
  }).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:"smooth"})});
}

/* ---------- 案件カード ---------- */
function cardHTML(c){
  const full = c.joined>=c.need;
  const pct = Math.min(100, Math.round(c.joined/c.need*100));
  return '<button class="card'+(full?" full":"")+'" data-case="'+c.id+'" style="--lvc:'+LV[c.lv].c+'">'+
    '<div class="card-top">'+lvBadge(c.lv)+'<span class="org-type">'+esc(c.type)+"</span>"+
      (state.newIds.has(c.id)?'<span class="badge-new">NEW</span>':"")+"</div>"+
    "<h3>"+esc(c.title)+"</h3>"+
    '<div class="org">'+esc(c.org)+"</div>"+
    '<div class="tags">'+c.tags.map(t=>'<span class="tag">'+esc(t)+"</span>").join("")+"</div>"+
    '<div class="card-meta"><span>'+icon.clock+esc(c.period)+"</span><span>"+icon.pin+esc(c.area)+"</span></div>"+
    '<div class="slots"><div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<span class="n"><b>'+c.joined+"</b>/"+c.need+" 名</span>"+
      '<span class="reward">'+yen(c.reward)+"円分</span></div>"+
  "</button>";
}

/* ---------- 画面：困りごとを探す ---------- */
function viewFind(){
  const lvChips = [1,2,3,4].map(l=>
    '<button class="chip" data-lv="'+l+'" aria-pressed="'+state.lv.has(l)+'"><span class="dot" style="background:'+LV[l].c+'"></span>Lv.'+l+" "+LV[l].name+"</button>").join("");
  const catChips = CATS.map(c=>'<button class="chip" data-cat="'+esc(c)+'" aria-pressed="'+state.cat.has(c)+'">'+esc(c)+"</button>").join("");

  let list = cases.filter(c=>{
    if(state.lv.size && !state.lv.has(c.lv)) return false;
    if(state.cat.size && !state.cat.has(c.cat)) return false;
    if(state.q){
      const hay = (c.title+c.org+c.mission+c.tags.join("")+c.area).toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });
  if(state.sort==="near") list = list.slice().sort((a,b)=>a.lv-b.lv);
  if(state.sort==="reward") list = list.slice().sort((a,b)=>b.reward-a.reward);
  if(state.sort==="urgent") list = list.slice().sort((a,b)=>(a.need-a.joined)-(b.need-b.joined)===0?0:(b.need-b.joined)-(a.need-a.joined));

  return '<div class="phead"><div>'+
      '<div class="eyebrow">困りごとを探す</div>'+
      "<h1>犬山の「困った」から、あなたの「やってみたい」を選ぶ</h1>"+
      '<p class="sub">市民・企業・行政から寄せられた案件です。関わる深さは Lv.1 の1日から Lv.4 の長期まで。まず1日だけ、から始められます。</p>'+
    "</div></div>"+
    '<div class="filters">'+
      '<div class="frow"><span class="flab">レベル</span>'+lvChips+"</div>"+
      '<div class="frow"><span class="flab">分野</span>'+catChips+"</div>"+
      '<div class="frow"><span class="flab">キーワード</span>'+
        '<span class="search">'+icon.search+'<input type="text" id="q" placeholder="祭り、SNS、子ども…" value="'+esc(state.q)+'"></span></div>'+
    "</div>"+
    '<div class="resbar"><div class="rescount"><b>'+list.length+"</b> 件の困りごと</div>"+
      '<select class="sortsel" id="sort">'+
        ['<option value="osusume">おすすめ順</option>','<option value="near">はじめやすい順</option>','<option value="urgent">人手が足りない順</option>','<option value="reward">商品券が多い順</option>']
        .map(o=>o.replace('value="'+state.sort+'"','value="'+state.sort+'" selected')).join("")+"</select></div>"+
    (list.length? '<div class="grid">'+list.map(cardHTML).join("")+"</div>"
                : '<div class="empty">条件に合う困りごとはまだありません。フィルターを外すか、「やりたいことを出す」から自分で提案してみてください。</div>');
}

/* ---------- 画面：マイページ ---------- */
function viewMe(){
  const done = state.my.filter(m=>m.status==="done");
  const active = state.my.filter(m=>m.status!=="done");
  const maxLv = state.my.reduce((a,m)=>{const c=cases.find(x=>x.id===m.caseId);return c?Math.max(a,c.lv):a},0);
  const hours = done.length*8 + active.length*4;

  const ladder = [1,2,3,4].map(l=>{
    const reached = state.my.some(m=>{const c=cases.find(x=>x.id===m.caseId);return c&&c.lv>=l});
    const n = state.my.filter(m=>{const c=cases.find(x=>x.id===m.caseId);return c&&c.lv===l}).length;
    return '<div class="rung'+(reached?" done":"")+'" style="--lvc:'+LV[l].c+'">'+
      '<span class="mark">'+(reached?icon.check:"")+"</span>"+
      "<span><span class='t'>Lv."+l+" "+esc(LV[l].name)+"</span><br><span class='d'>"+esc(LV[l].desc)+"</span></span>"+
      '<span class="c">'+(n?n+" 件":"—")+"</span></div>";
  }).join("");

  const rows = state.my.slice().reverse().map(m=>{
    const c = cases.find(x=>x.id===m.caseId); if(!c) return "";
    const st = m.status==="done" ? '<span class="status done">完了</span>'
             : m.status==="accepted" ? '<span class="status on">参加決定</span>'
             : '<span class="status wait">承認待ち</span>';
    return "<li><span class='when num'>"+esc(m.when)+"</span><span><span class='t'>"+esc(c.title)+"</span><br><span class='m'>"+esc(c.org)+" ／ Lv."+c.lv+" ／ "+(m.got?yen(m.got)+"円分 受取済":yen(c.reward)+"円分 予定")+"</span></span>"+st+"</li>";
  }).join("");

  return '<div class="phead"><div>'+
      '<div class="eyebrow">マイページ</div>'+
      "<h1>あなたが犬山で積み上げてきたもの</h1>"+
      '<p class="sub">参加は記録として残り、経験証明として書き出せます。受け取った商品券は市内の加盟店で使えます。</p>'+
    "</div></div>"+
    '<div class="stack-lg">'+
    '<div class="stats">'+
      '<div class="stat"><div class="lab">参加した案件</div><div class="v">'+state.my.length+'<span class="u">件</span></div><div class="foot">完了 '+done.length+" ／ 進行中 "+active.length+"</div></div>"+
      '<div class="stat"><div class="lab">到達レベル</div><div class="v">Lv.'+(maxLv||"—")+'</div><div class="foot">'+(maxLv?esc(LV[maxLv].name):"まだ参加していません")+"</div></div>"+
      '<div class="stat"><div class="lab">活動時間</div><div class="v">'+hours+'<span class="u">時間</span></div><div class="foot">目安の累計</div></div>'+
      '<div class="stat"><div class="lab">商品券残高</div><div class="v">'+yen(state.wallet)+'<span class="u">円</span></div><div class="foot">市内 42 店舗で利用可</div></div>'+
    "</div>"+
    '<div class="cols">'+
      '<div class="stack">'+
        '<div class="panel"><h3>参加の記録</h3><p class="note">応募・参加・完了が時系列で残ります。</p>'+
          (rows?'<ul class="hist">'+rows+"</ul>":'<div class="empty">まだ参加履歴がありません。「困りごとを探す」から Lv.1 の案件を選んでみてください。</div>')+"</div>"+
        '<div class="panel"><h3>商品券の使いみち</h3><p class="note">活動1件ごとに、犬山市内で使える商品券が発行されます。市外に出ていかないお金として地域に戻ります。</p>'+
          '<div class="shops">'+["城下町の和菓子店","本町通りの喫茶店","犬山焼の窯元","駅前の書店","木曽川沿いの食堂","市内のスーパー4店","ほか 34 店舗"].map(s=>'<span class="shop">'+esc(s)+"</span>").join("")+"</div></div>"+

      "</div>"+
      '<div class="field"><label>お願いしたいこと</label><textarea id="c-mission" placeholder="現場でどんなことが起きているか、何をお願いしたいかを書いてください"></textarea></div>'+
      '<div class="field"><label>お礼（市内商品券）</label><input type="number" id="c-reward" value="5000" min="0" step="500"><span class="hint">相場：Lv.1 で 3,000円／Lv.4 で 30,000円程度。市の補助が使えます。</span></div>'+
      '<button class="btn" id="c-submit">学生運営チームに送る</button>'+
    "</div></div>"+
    '<div class="stack">'+
      '<div class="panel"><h3>投稿したあとの流れ</h3><p class="note">公開までは、だいたい3日です。</p><ul class="steps" style="margin-top:4px">'+
        [["1","学生運営チームが内容を確認し、電話または訪問でヒアリング"],["2","レベル・期間・人数を一緒に調整して募集文にする"],["3","プラットフォームとSNSで公開（掲載は無料）"],["4","応募者を確認し、承認すると連絡先が共有される"],["5","活動後、学生が記録を作成。次年度の募集にそのまま使える"]]
        .map(s=>'<li><span class="k">'+s[0]+"</span><span>"+esc(s[1])+"</span></li>").join("")+"</ul></div>"+
      '<div class="panel"><h3>役割の分担</h3><p class="note">行政が基盤をつくり、学生チームが日々の運営を担います。</p>'+
        '<ul class="steps" style="margin-top:4px">'+
        [["行","仕組みづくり・募集先の確認・大学や企業との連携"],["学","案件の整理・学生とのマッチング・活動後の発信と記録"],["民","困りごとの投稿・現場でのサポート・活動へのフィードバック"]]
        .map(s=>'<li><span class="k">'+s[0]+"</span><span>"+esc(s[1])+"</span></li>").join("")+"</ul></div>"+
    "</div></div>";
}

/* ---------- 画面：応募状況（地域） ---------- */
function viewManage(){
  const mine = cases.filter(c=>applicants[c.id]);
  return '<div class="phead"><div>'+
      '<div class="eyebrow">応募状況</div>'+
      "<h1>あなたの投稿に、誰が手を挙げているか</h1>"+
      '<p class="sub">承認すると連絡先が共有され、学生運営チームが初回の顔合わせを設定します。</p>'+
    "</div></div>"+
    '<div class="stack">'+ mine.map(c=>{
      const as = applicants[c.id];
      return '<div class="panel" style="--lvc:'+LV[c.lv].c+'">'+
        '<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px">'+
          "<div><h3>"+esc(c.title)+'</h3><p class="note" style="margin:2px 0 0">'+lvBadge(c.lv)+" ／ "+esc(c.period)+" ／ "+c.joined+"/"+c.need+" 名</p></div>"+
          '<span class="status '+(c.joined>=c.need?"done":"on")+'" style="margin-left:auto">'+(c.joined>=c.need?"募集終了":"募集中")+"</span></div>"+
        (as.length? as.map((a,i)=>'<div class="appl"><span class="av" style="background:'+avColor(i)+'">'+esc(a.n[0])+"</span>"+
            "<span><span class='who'>"+esc(a.n)+"</span><br><span class='uni'>"+esc(a.u)+"</span></span>"+
            "<span class='msg'>"+esc(a.m)+"</span>"+
            '<button class="btn sm" data-approve="'+c.id+'|'+i+'">承認する</button></div>').join("")
          : '<div class="empty" style="padding:26px">まだ応募がありません。学生運営チームが大学のサークルとゼミに案内を出しています。</div>')+
      "</div>";
    }).join("")+"</div>";
}

/* ---------- 画面：学生からの提案（地域） ---------- */
function viewVoices(){
  return '<div class="phead"><div>'+
      '<div class="eyebrow">学生からの提案</div>'+
      "<h1>「犬山でこれをやりたい」という声</h1>"+
      '<p class="sub">学生側から出てきた企画です。受け手として名乗り出ると、学生運営チームが間に入って実現を進めます。</p>'+
    "</div></div>"+
    '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(330px,1fr))">'+
    proposals.map(p=>'<article class="prop">'+
      '<div class="q">犬山で <span class="fill">'+esc(p.fill)+"</span></div>"+
      '<div class="by">'+esc(p.by)+" ／ 共感 "+p.likes+" ／ 仲間 "+p.want+" 名募集</div>"+
      '<p class="body">'+esc(p.body)+"</p>"+
      '<div class="prop-foot"><button class="btn sm" data-host="'+p.id+'">受け手になる</button>'+
        '<span class="pill-status">'+esc(p.status)+"</span></div></article>").join("")+"</div>";
}

/* ---------- 詳細ドロワー ---------- */
let openId = null;
function openCase(id){
  const c = cases.find(x=>x.id===id); if(!c) return;
  openId = id;
  const mine = state.my.find(m=>m.caseId===id);
  const full = c.joined>=c.need;
  const dw = $("#drawer");
  dw.style.setProperty("--lvc", LV[c.lv].c);
  dw.innerHTML =
    '<div class="dw-head"><div style="flex:1">'+
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">'+lvBadge(c.lv)+'<span class="org-type">'+esc(c.type)+'</span><span class="tag">'+esc(c.cat)+"</span></div>"+
      '<h2 id="dw-title">'+esc(c.title)+"</h2>"+
      '<div class="org" style="font-size:12.5px;color:var(--ink2);margin-top:4px">'+esc(c.org)+"</div>"+
    "</div>"+
    '<button class="xbtn" id="dw-x" aria-label="閉じる">'+icon.x+"</button></div>"+
    '<div class="dw-body">'+
      '<dl class="spec">'+
        "<dt>期間</dt><dd>"+esc(c.period)+"</dd>"+
        "<dt>場所</dt><dd>"+esc(c.area)+"</dd>"+
        "<dt>募集</dt><dd><span class='num'>"+c.joined+"</span> / "+c.need+" 名"+(full?"（定員に達しました）":"（あと "+(c.need-c.joined)+" 名）")+"</dd>"+
        "<dt>お礼</dt><dd style='color:var(--kin);font-weight:500'>市内商品券 "+yen(c.reward)+" 円分</dd>"+
      "</dl>"+
      '<div class="sec"><h4>お願いしたいこと</h4><p>'+esc(c.mission)+"</p></div>"+
      '<div class="sec"><h4>こんな人に</h4><p>'+esc(c.want)+"</p></div>"+
      '<div class="sec"><h4>得られる経験</h4><p>'+esc(c.gain)+"</p></div>"+
      '<div class="sec"><h4>進め方</h4><ul class="steps">'+c.sched.map((s,i)=>'<li><span class="k">'+(i+1)+"</span><span>"+esc(s)+"</span></li>").join("")+"</ul></div>"+
      '<div class="sec"><h4>いま参加している仲間</h4>'+
        (c.members.length?'<div class="people" style="margin-top:2px">'+c.members.map((m,i)=>'<span class="av" style="background:'+avColor(i)+'">'+esc(m[0])+"</span>").join("")+
          '<span style="font-size:12.5px;color:var(--ink2);margin-left:16px">'+c.members.length+" 名が参加中</span></div>"
         :"<p>まだ誰もいません。最初のひとりになれます。</p>")+"</div>"+
    "</div>"+
    '<div class="dw-foot">'+
      (mine ? '<button class="btn flex" disabled>'+(mine.status==="done"?"参加しました":"応募済み — 承認待ち")+"</button>"
        : full ? '<button class="btn flex" disabled>定員に達しました</button><button class="btn ghost" id="dw-watch">気になる</button>'
        : '<button class="btn flex" id="dw-apply">この困りごとに応募する</button><button class="btn ghost" id="dw-friend">仲間を誘う</button>')+
    "</div>";
  dw.hidden=false; $("#scrim").hidden=false;
  requestAnimationFrame(()=>{dw.classList.add("on");$("#scrim").classList.add("on")});
  document.body.style.overflow="hidden";

  $("#dw-x").onclick=closeDrawer;
  const ap=$("#dw-apply"); if(ap) ap.onclick=()=>apply(c.id);
  const fr=$("#dw-friend"); if(fr) fr.onclick=()=>toast("募集リンクをコピーしました。友達に送ってみてください");
  const wt=$("#dw-watch"); if(wt) wt.onclick=()=>{toast("「気になる」に登録しました。次の募集が出たら通知します");closeDrawer()};
  dw.querySelector(".dw-body").scrollTop=0;
}
function closeDrawer(){
  const dw=$("#drawer");
  dw.classList.remove("on"); $("#scrim").classList.remove("on");
  document.body.style.overflow="";
  setTimeout(()=>{dw.hidden=true;$("#scrim").hidden=true;openId=null},300);
}
function apply(id){
  const c=cases.find(x=>x.id===id); if(!c) return;
  c.joined++; c.members.push("あなた");
  const d=new Date();
  state.my.push({caseId:id, status:"accepted", when:(d.getFullYear())+"/"+String(d.getMonth()+1).padStart(2,"0")});
  state.wallet += c.reward;
  closeDrawer();
  toast("応募しました。商品券 "+yen(c.reward)+" 円分が受け取り予定に加わりました");
  render();
}

/* ---------- レンダリング ---------- */
function render(){
  renderTabs();
  $("#wallet-v").textContent = yen(state.wallet);
  $("#role-s").setAttribute("aria-pressed", state.role==="student");
  $("#role-c").setAttribute("aria-pressed", state.role==="city");
  $("#wallet").style.display = state.role==="student" ? "" : "none";

  const v=$("#view");
  const map={find:viewFind,want:viewWant,logs:viewLogs,me:viewMe,post:viewPost,manage:viewManage,voices:viewVoices};
  v.innerHTML = (map[state.tab]||viewFind)() +
    '<p class="footnote">これは企画提案用のデモです。掲載している案件・実績・数値はサンプルで、実在の団体の募集ではありません。'+
    "課題の出典：犬山市「令和7年度 施政方針」／「まち・ひと・しごと創生総合戦略 2025–2030」／「犬山市観光戦略（案）」／中日新聞Web</p>";
  bind();
}

function bind(){
  document.querySelectorAll("[data-case]").forEach(b=>b.onclick=()=>openCase(+b.dataset.case));
  document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{
    const l=+b.dataset.lv; state.lv.has(l)?state.lv.delete(l):state.lv.add(l); render();
  });
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
    const c=b.dataset.cat; state.cat.has(c)?state.cat.delete(c):state.cat.add(c); render();
  });
  const q=$("#q");
  if(q) q.oninput=()=>{ state.q=q.value; const pos=q.selectionStart; render(); const n=$("#q"); if(n){n.focus();n.setSelectionRange(pos,pos)} };
  const s=$("#sort"); if(s) s.onchange=()=>{state.sort=s.value;render()};

  document.querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>{
    const p=proposals.find(x=>x.id===+b.dataset.like);
    p.liked=!p.liked; p.likes+=p.liked?1:-1; render();
  });
  document.querySelectorAll("[data-join-prop]").forEach(b=>b.onclick=()=>{
    const p=proposals.find(x=>x.id===+b.dataset.joinProp);
    toast("「"+p.fill+"」のチームに参加希望を送りました");
  });
  document.querySelectorAll("[data-host]").forEach(b=>b.onclick=()=>{
    const p=proposals.find(x=>x.id===+b.dataset.host);
    p.status="受け手が名乗り出ました"; render();
    toast("受け手として登録しました。学生運営チームから連絡が入ります");
  });
  document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{
    const [cid,i]=b.dataset.approve.split("|");
    const c=cases.find(x=>x.id===+cid); const a=applicants[cid][+i];
    if(c.joined<c.need){c.joined++;c.members.push(a.n.split(" ")[0][0]+"."+a.n.split(" ")[1][0])}
    applicants[cid].splice(+i,1);
    toast(a.n+" さんの参加が決まりました。連絡先を共有しました");
    render();
  });

  const ps=$("#p-submit");
  if(ps) ps.onclick=()=>{
    const fill=$("#p-fill").value.trim(), body=$("#p-body").value.trim();
    if(!fill){ $("#p-fill").focus(); toast("やりたいことを入力してください"); return; }
    proposals.unshift({id:nextId++, fill, by:"あなた（学生）", lv:+$("#p-lv").value, want:+$("#p-want").value||1,
      likes:0, liked:false, body: body||"（説明はあとから追記できます）", status:"学生運営チームが確認中"});
    toast("提案を投稿しました。共感が5人集まると受け手を探し始めます");
    render();
  };

  const lvp=$("#c-lv");
  if(lvp) lvp.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    lvp.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
  });
  const cs=$("#c-submit");
  if(cs) cs.onclick=()=>{
    const title=$("#c-title").value.trim();
    if(!title){ $("#c-title").focus(); toast("困っていることを入力してください"); return; }
    const lv=+(lvp.querySelector('[aria-pressed="true"]')||{dataset:{l:1}}).dataset.l;
    const id=nextId++;
    cases.unshift({id, title, org:$("#c-org").value.trim()||"名称未設定の団体", type:$("#c-type").value, lv,
      cat:$("#c-cat").value, period:$("#c-period").value.trim()||LV[lv].span, area:$("#c-area").value.trim()||"犬山市内",
      need:+$("#c-need").value||1, joined:0, reward:+$("#c-reward").value||0,
      tags:[$("#c-cat").value,"新着"],
      mission:$("#c-mission").value.trim()||"学生運営チームがヒアリングして詳細を整理します。",
      want:"学生運営チームと調整中", gain:"学生運営チームと調整中",
      sched:["学生運営チームがヒアリング","募集文の調整","公開と募集","応募者の承認"], members:[]});
    applicants[id]=[];
    state.newIds.add(id);
    toast("送信しました。3日以内に学生運営チームから連絡が入ります");
    state.tab="manage"; render(); window.scrollTo({top:0,behavior:"smooth"});
  };

  const cd=$("#cert-dl"); if(cd) cd.onclick=()=>toast("経験証明のPDFを書き出しました（デモのため実際のファイルは生成されません）");
  const csh=$("#cert-share"); if(csh) csh.onclick=()=>toast("提出用リンクを作成しました。有効期限は90日です");
}

/* ---------- 起動 ---------- */
$("#role-s").onclick=()=>{state.role="student";state.tab="find";render();window.scrollTo({top:0,behavior:"smooth"})};
$("#role-c").onclick=()=>{state.role="city";state.tab="post";render();window.scrollTo({top:0,behavior:"smooth"})};
$("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openId!==null)closeDrawer()});
render();
})();
</script>

</body>
</html>
